{% extends "base.html" %}

{% block title %}Nouveau fournisseur{% endblock %}

{% block body %}
<div class="page-header mb-4"><h2 class="page-title">Nouveau fournisseur</h2></div>
<form method="post" class="card" novalidate>
    {% csrf_token %}
    <div class="card-body">
        <div class="row g-3">
            {% for field in form %}
                <div class="{% if field.name == 'address' %}col-12{% else %}col-md-6{% endif %}">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
                </div>
            {% endfor %}
        </div>
    </div>
    <div class="card-footer text-end"><button class="btn btn-primary">Créer le fournisseur</button></div>
</form>
{% endblock %}
